      <div style="padding: 2rem; max-width: 800px; margin: 0 auto; color: #f3f4f6; font-family: sans-serif;">
        <h1 style="color: #17DE8F;">Wasto: Automated Waste Classification, Actuation & Tracking Platform</h1>
        <p>Wasto is an end-to-end automated waste segregation and municipal lifecycle tracking platform. It bridges optical edge deep learning (MobileNetV3Large), embedded microcontroller servo flap deflection (Arduino Uno), and persistent source-to-recycling provenance tracking.</p>
        <h2>Key Capabilities</h2>
        <ul>
          <li><strong>Optical Edge Classification:</strong> 9 material classes (Organic, Aluminium, Carton, Glass, Paper &amp; Cardboard, Plastic, Other Plastics, Textiles, Wood).</li>
          <li><strong>3-Chute Physical Deflection:</strong> Servo-actuated flaps for Chute 1 (Organic), Chute 2 (Recyclable), and Chute 3 (Residual) with failsafe manual review abstention.</li>
          <li><strong>Smart Dustbin Telemetry:</strong> Ultrasonic fill-level telemetry alerting authorities before overflow.</li>
          <li><strong>Municipal Batch Provenance:</strong> Immutable audit trail from source registration, transport pickup, weighbridge verification to recycling disposition.</li>
        </ul>
        <p>Please enable JavaScript to access the interactive real-time dashboard and classification tools.</p>
